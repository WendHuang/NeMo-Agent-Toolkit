[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
# NAT uses the --first-parent flag to avoid tags from previous releases which have been merged into the develop branch
# from causing an unexpected version change. This can be safely removed if developing outside of the NAT repository.
git_describe_command = "git describe --long --first-parent"
root = "../../.."

[project]
name = "retail_sales_agent_nb6"
dynamic = ["version"]
dependencies = [
  "nvidia-nat[langchain]",
]
requires-python = ">=3.11,<3.14"
description = "Custom NeMo Agent Toolkit Workflow"
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
nvidia-nat = { path = "../../..", editable = true }
nvidia-nat-langchain = { path = "../../../packages/nvidia_nat_langchain", editable = true }
nvidia-nat-redis = { path = "../../../packages/nvidia_nat_redis", editable = true }
nvidia-nat-profiling = { path = "../../../packages/nvidia_nat_profiling", editable = true }
nvidia-nat-phoenix = { path = "../../../packages/nvidia_nat_phoenix", editable = true }
nvidia-nat-weave = { path = "../../../packages/nvidia_nat_weave", editable = true }
nvidia-nat-opentelemetry = { path = "../../../packages/nvidia_nat_opentelemetry", editable = true }
nvidia-nat-llama-index= { path = "../../../packages/nvidia_nat_llama_index", editable = true }


[project.entry-points.'nat.components']
retail_sales_agent_nb6 = "retail_sales_agent_nb6.register"